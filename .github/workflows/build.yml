name: Build and Package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write  # required for creating GitHub releases

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install XMake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Cache XMake packages
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/.xmake
          key: xmake-${{ runner.os }}-${{ hashFiles('xmake.lua', 'extern/CommonLibSF/xmake.lua') }}
          restore-keys: xmake-${{ runner.os }}-

      - name: Configure (releasedbg, x64)
        run: xmake f -m releasedbg -a x64 -y

      - name: Build
        run: xmake -y

      - name: Build release ZIP
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $env:GITHUB_REF_NAME -replace '^v', ''
          } else { 'dev' }
          python package.py --version $version
          "VERSION=$version"                                 | Out-File -FilePath $env:GITHUB_ENV -Append
          "ZIP_NAME=Complete-Planet-Survey-$version.zip"     | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: complete-planet-survey
          path: Complete-Planet-Survey-*.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Complete-Planet-Survey-*.zip
          generate_release_notes: true

      # Nexus upload on the Nexus Mods v3 API (action beta.8): createModFileVersion
      # (POST /mod-files/{id}/versions). Requires repo variable NEXUS_FILE_ID = the mod-file
      # GROUP id (7302980), found via the v2 GraphQL modFiles{groupId}. A per-upload file id
      # (e.g. 68174) returns 404 "Mod file not found" — that 404 sank the v1.1.0 release before
      # the id was corrected to the group id (untested until the next tagged release).
      # Still a beta pin; move to v1 or a commit SHA once it stabilises.
      - name: Upload to Nexus Mods
        if: startsWith(github.ref, 'refs/tags/v')
        uses: Nexus-Mods/upload-action@v1.0.0-beta.8
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ vars.NEXUS_FILE_ID }}
          filename: ${{ env.ZIP_NAME }}
          display_name: Complete Planet Survey
          version: ${{ env.VERSION }}
          category: main
