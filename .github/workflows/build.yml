name: Build and Package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write  # required for creating GitHub releases

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # Pinned so CI builds are reproducible; bump deliberately (must stay >= set_xmakever in xmake.lua).
  XMAKE_VERSION: '3.1.2'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install XMake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: ${{ env.XMAKE_VERSION }}

      - name: Cache XMake packages
        uses: actions/cache@v5
        with:
          path: ~/AppData/Local/.xmake
          key: xmake-${{ runner.os }}-${{ env.XMAKE_VERSION }}-${{ hashFiles('xmake.lua', 'extern/CommonLibSF/xmake.lua') }}
          restore-keys: xmake-${{ runner.os }}-${{ env.XMAKE_VERSION }}-

      - name: Configure (releasedbg, x64)
        run: xmake f -m releasedbg -a x64 -y

      - name: Build
        run: xmake -y

      - name: Build release ZIP
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $env:GITHUB_REF_NAME -replace '^v', ''
          } else { 'dev' }
          python package.py --version $version
          "VERSION=$version"                                 | Out-File -FilePath $env:GITHUB_ENV -Append
          "ZIP_NAME=Complete-Planet-Survey-$version.zip"     | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: complete-planet-survey
          path: Complete-Planet-Survey-*.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: Complete-Planet-Survey-*.zip
          generate_release_notes: true

      # Nexus upload on the Nexus Mods v3 API: createModFileVersion (POST /mod-files/{id}/versions).
      # Requires repo variable NEXUS_FILE_ID = the mod-file GROUP id (7302980), found via the v2
      # GraphQL modFiles{groupId}. A per-upload file id (e.g. 68174) returns 404 "Mod file not
      # found" — that 404 sank the v1.1.0 release before the id was corrected to the group id.
      # The action has no stable v1 yet, so it is pinned to the v1.0.0-beta.11 commit SHA (a tag
      # can be moved; a SHA can't). beta.9-11 only ADD optional inputs (update_mod_version,
      # mod_id, changelog) — the inputs below are unchanged from beta.8.
      - name: Upload to Nexus Mods
        if: startsWith(github.ref, 'refs/tags/v')
        uses: Nexus-Mods/upload-action@98532f7670c27cbecc78fae03fa3e278147827e2 # v1.0.0-beta.11
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ vars.NEXUS_FILE_ID }}
          filename: ${{ env.ZIP_NAME }}
          display_name: Complete Planet Survey
          version: ${{ env.VERSION }}
          category: main
